version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: actumoto-app:staging
    container_name: actumoto_app_staging
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.staging
    volumes:
      - uploads_staging:/app/public/img
    networks:
      - traefik_net
      - staging_internal
    labels:
      - "traefik.enable=true"
      # Routeur public pour Facebook / Google / Web Push (RGPD, Conditions, Callbacks OAuth, Service Worker) sans basic auth
      - "traefik.http.routers.actumoto-staging-public.rule=Host(`test.actumoto.tn`) && (PathPrefix(`/politique-de-confidentialite`) || PathPrefix(`/conditions-de-service`) || PathPrefix(`/suppression-donnees`) || PathPrefix(`/api/auth`) || PathPrefix(`/sw.js`) || PathPrefix(`/manifest.webmanifest`) || PathPrefix(`/api/push`))"
      - "traefik.http.routers.actumoto-staging-public.entrypoints=websecure"
      - "traefik.http.routers.actumoto-staging-public.tls.certresolver=letsencrypt"
      - "traefik.http.routers.actumoto-staging-public.middlewares=noindex-staging"
      - "traefik.http.routers.actumoto-staging-public.priority=100"
      - "traefik.http.routers.actumoto-staging-public.service=actumoto-staging"

      # Routeur standard pour le reste du site protégé par basic auth
      - "traefik.http.routers.actumoto-staging.rule=Host(`test.actumoto.tn`)"
      - "traefik.http.routers.actumoto-staging.entrypoints=websecure"
      - "traefik.http.routers.actumoto-staging.tls.certresolver=letsencrypt"
      - "traefik.http.routers.actumoto-staging.middlewares=auth-staging,noindex-staging"
      - "traefik.http.services.actumoto-staging.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_net"

  db:
    image: postgres:15-alpine
    container_name: actumoto_db_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    networks:
      - staging_internal

  static:
    image: nginx:alpine
    container_name: actumoto_static_staging
    restart: unless-stopped
    volumes:
      - uploads_staging:/usr/share/nginx/html/img:ro
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      # Icônes et images de notifications accessibles sans basic auth pour le Service Worker Push
      - "traefik.http.routers.actumoto-static-push.rule=Host(`test.actumoto.tn`) && (PathPrefix(`/img/icon-`) || PathPrefix(`/img/favicon-`) || PathPrefix(`/img/notifications`))"
      - "traefik.http.routers.actumoto-static-push.entrypoints=websecure"
      - "traefik.http.routers.actumoto-static-push.tls.certresolver=letsencrypt"
      - "traefik.http.routers.actumoto-static-push.middlewares=noindex-staging"
      - "traefik.http.routers.actumoto-static-push.priority=110"
      - "traefik.http.routers.actumoto-static-push.service=actumoto-static"

      - "traefik.http.routers.actumoto-static.rule=Host(`test.actumoto.tn`) && PathPrefix(`/img`)"
      - "traefik.http.routers.actumoto-static.entrypoints=websecure"
      - "traefik.http.routers.actumoto-static.tls.certresolver=letsencrypt"
      - "traefik.http.routers.actumoto-static.middlewares=auth-staging,noindex-staging"
      - "traefik.http.services.actumoto-static.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_net"


volumes:
  uploads_staging:
  pgdata_staging:

networks:
  traefik_net:
    external: true
  staging_internal:
    driver: bridge
